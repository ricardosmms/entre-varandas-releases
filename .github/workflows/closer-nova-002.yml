name: CLOSER 0.0.2 - Portas e galeria
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/closer-nova-002.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Baixar fonte
        shell: pwsh
        run: |
          python -m pip install "gdown>=5,<6"
          gdown --id 1yaFrPPpnbn5wqKeJC0OBSTgQOx5JeQV1 -O source.zip
          if ((Get-FileHash source.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne "69415203ee0d78063f377f4d7e8e259febfdd6714a8b8d8c4cf22acf1eef0389") { throw "SHA256 incorreto" }
          Expand-Archive source.zip -DestinationPath source
      - name: Instalar
        working-directory: source/CLOSER_v0.0.2_SOURCE
        run: npm install --no-audit --no-fund
      - name: Testar
        working-directory: source/CLOSER_v0.0.2_SOURCE
        run: npm test
      - name: Compilar
        working-directory: source/CLOSER_v0.0.2_SOURCE
        run: npm run package:win
      - name: Publicar
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = "source/CLOSER_v0.0.2_SOURCE/dist/CLOSER_Setup_v0.0.2.exe"
          if (!(Test-Path $installer)) { throw "Instalador ausente" }
          gh release view v0.0.2 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.0.2 $installer --clobber
          } else {
            gh release create v0.0.2 $installer --prerelease --title "CLOSER v0.0.2 - Portas ilustradas e galeria" --notes "Elevador ilustrado animado; menu inicial sempre presente; galeria que revela imagens vistas e preserva desbloqueios."
          }
