name: CLOSER 0.0.5 - CG de Bruna e transicao cinematica
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/closer-nova-005.yml'
      - 'release/build-005-trigger.txt'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Baixar fonte
        shell: pwsh
        run: |
          python -m pip install "gdown>=5,<6"
          gdown --id 1Fh9evPsK-RWhNR6FA2CxlN4B6re8UoQN -O source.zip
          if ((Get-FileHash source.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne "9bdfa908aaaa0faded4716f493ab81426bc7a43b0adcdb82e477bbc82c618262") { throw "SHA256 incorreto" }
          Expand-Archive source.zip -DestinationPath source
      - name: Instalar
        working-directory: source/CLOSER_v0.0.5_SOURCE
        run: npm install --no-audit --no-fund
      - name: Testar
        working-directory: source/CLOSER_v0.0.5_SOURCE
        run: npm test
      - name: Compilar
        working-directory: source/CLOSER_v0.0.5_SOURCE
        run: npm run package:win
      - name: Publicar
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = "source/CLOSER_v0.0.5_SOURCE/dist/CLOSER_Setup_v0.0.5.exe"
          if (!(Test-Path $installer)) { throw "Instalador ausente" }
          gh release view v0.0.5 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.0.5 $installer --clobber
          } else {
            gh release create v0.0.5 $installer --prerelease --title "CLOSER v0.0.5 - Primeiro encontro cinematografico" --notes "CG de Bruna na porta 704; fade-out e fade-in; botão Aperte para continuar; entrada do sprite com slide desacelerado e fade; fala apenas após animação; galeria com CG; salvamentos compatíveis. Prévia para testes."
          }
