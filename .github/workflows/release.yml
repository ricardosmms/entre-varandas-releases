name: Publicar instalador CLOSER v0.6.2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'release/drive_manifest_release.json'
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar fontes da publicacao
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar cliente de download
        run: python -m pip install --disable-pip-version-check 'gdown>=5,<6'

      - name: Recuperar e validar instalador
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, time
          import gdown

          manifest = json.loads(pathlib.Path('release/drive_manifest_release.json').read_text(encoding='utf8'))
          output_dir = pathlib.Path('dist')
          output_dir.mkdir(exist_ok=True)
          installer = output_dir / manifest['filename']

          def digest(path):
              hasher = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      hasher.update(chunk)
              return hasher.hexdigest()

          with installer.open('wb') as destination:
              for index, (part_name, details) in enumerate(manifest['parts'].items(), 1):
                  part_path = output_dir / part_name
                  for attempt in range(4):
                      try:
                          if part_path.exists():
                              part_path.unlink()
                          result = gdown.download(id=details['id'], output=str(part_path),
                                                  quiet=True, use_cookies=False)
                          if not result or not part_path.is_file():
                              raise RuntimeError('Falha no download: ' + part_name)
                          if part_path.stat().st_size != details['size']:
                              raise RuntimeError('Tamanho incorreto: ' + part_name)
                          if digest(part_path) != details['sha256']:
                              raise RuntimeError('SHA-256 incorreto: ' + part_name)
                          break
                      except Exception as error:
                          if attempt == 3:
                              raise
                          print(f'Tentativa {attempt + 1}: {error}', flush=True)
                          time.sleep(5 * (attempt + 1))
                  print(f'Parte {index}/{len(manifest["parts"])} verificada', flush=True)
                  with part_path.open('rb') as source:
                      for chunk in iter(lambda: source.read(1024 * 1024), b''):
                          destination.write(chunk)
                  part_path.unlink()

          if installer.stat().st_size != manifest['size']:
              raise RuntimeError('Instalador final: tamanho incorreto')
          if digest(installer) != manifest['sha256']:
              raise RuntimeError('Instalador final: SHA-256 incorreto')

          print('Instalador completo verificado:', installer, flush=True)
          PY

      - name: Publicar release de teste
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v0.6.2 >/dev/null 2>&1; then
            gh release upload v0.6.2 dist/CLOSER_Instalador_Offline_v0.6.2.exe --clobber
          else
            gh release create v0.6.2 dist/CLOSER_Instalador_Offline_v0.6.2.exe \
              --prerelease \
              --title 'CLOSER v0.6.2 - Teste visual' \
              --notes 'Instalador completo offline para Windows 64 bits. Sprites de Bruna em estilo manhwa e cenarios experimentais. Versao preliminar, sem assinatura digital e sem teste de execucao em Windows real.'
          fi
